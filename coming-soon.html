<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Coming Soon - FADA' Learning Platform">
    <meta name="keywords" content="coding, programming, learning, education">
    <meta name="author" content="FADA'">
    
    <!-- Theme Color for Mobile Browsers -->
    <meta name="theme-color" content="#0a192f">
    
    <title>Coming Soon | FADA'</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="32x32" href="../images/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="../images/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="../images/apple-touch-icon.png">
    
    <!-- Open Graph / Social Media Meta Tags -->
    <meta property="og:title" content="Coming Soon | FADA'">
    <meta property="og:description" content="Something amazing is in the works. Stay tuned!">
    <meta property="og:image" content="../images/og-image.jpg">
    <meta property="og:url" content="https://fadacode.com/coming-soon">
    <meta name="twitter:card" content="summary_large_image">
    
    <!-- Preconnect to External Resources -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://cdnjs.cloudflare.com">
    
    <!-- Modern Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
    
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Main Stylesheet -->
    <link rel="stylesheet" href="../style.css">
    
    <!-- GSAP Animation Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
    
    <!-- Particle Effects -->
    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    
    <style>
        .coming-soon-container {
            height: 100vh;
            width: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 0 20px;
            position: relative;
            z-index: 10;
        }
        
        .logo-text {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 1rem;
            font-family: 'Space Grotesk', sans-serif;
            background: linear-gradient(90deg, #4ca5ff, #b673f8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: pulsate 2s ease-out infinite;
        }
        
        .coming-soon-title {
            font-size: 3.5rem;
            font-weight: 700;
            margin-bottom: 1.5rem;
            background: linear-gradient(45deg, #61dafb, #764abc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .coming-soon-subtitle {
            font-size: 1.25rem;
            max-width: 600px;
            margin-bottom: 3rem;
            color: #94a3b8;
            line-height: 1.6;
        }
        
        .countdown-container {
            display: flex;
            justify-content: center;
            margin-bottom: 3rem;
        }
        
        .countdown-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0 1.5rem;
        }
        
        .countdown-value {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            color: #fff;
            width: 80px;
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
            backdrop-filter: blur(10px);
        }
        
        .countdown-label {
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #94a3b8;
        }
        
        .subscribe-form {
            position: relative;
            max-width: 500px;
            width: 100%;
            margin-bottom: 3rem;
        }
        
        .subscribe-input {
            width: 100%;
            padding: 1rem 1.5rem;
            padding-right: 140px;
            font-size: 1rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 30px;
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            outline: none;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
            transition: all 0.3s ease;
        }
        
        .subscribe-input::placeholder {
            color: #64748b;
        }
        
        .subscribe-input:focus {
            border-color: #4ca5ff;
            box-shadow: 0 0 0 2px rgba(76, 165, 255, 0.3);
        }
        
        .subscribe-button {
            position: absolute;
            right: 5px;
            top: 5px;
            bottom: 5px;
            padding: 0 1.5rem;
            font-size: 0.9rem;
            font-weight: 600;
            border: none;
            border-radius: 25px;
            background: linear-gradient(90deg, #4ca5ff, #b673f8);
            color: #fff;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .subscribe-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(76, 165, 255, 0.4);
        }
        
        .social-links {
            display: flex;
            margin-bottom: 3rem;
        }
        
        .social-link {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 45px;
            height: 45px;
            margin: 0 10px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #94a3b8;
            font-size: 1.2rem;
            transition: all 0.3s ease;
        }
        
        .social-link:hover {
            transform: translateY(-3px);
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }
        
        .back-home {
            color: #94a3b8;
            text-decoration: none;
            font-size: 0.9rem;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .back-home i {
            margin-right: 5px;
            font-size: 0.8rem;
        }
        
        .back-home:hover {
            color: #fff;
        }
        
        .particles-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        
        @keyframes pulsate {
            0% {
                opacity: 0.6;
            }
            50% {
                opacity: 1;
            }
            100% {
                opacity: 0.6;
            }
        }
        
        @media screen and (max-width: 768px) {
            .coming-soon-title {
                font-size: 2.5rem;
            }
            .countdown-container {
                flex-wrap: wrap;
            }
            .countdown-item {
                margin: 0.5rem;
            }
        }
    </style>
</head>
<body>
    <!-- Particle Background -->
    <div id="particles-js" class="particles-container"></div>
    
    <div class="coming-soon-container">
        <div class="logo-text">FADA'</div>
        
        <h1 class="coming-soon-title">Coming Soon</h1>
        
        <p class="coming-soon-subtitle">
            We're working on something amazing! Our new learning path will be launching soon.
        </p>
       
        </div>
      
        </div>
        
       
   
    
    <script>
        // Initialize particles.js
        document.addEventListener('DOMContentLoaded', function() {
            particlesJS('particles-js', {
                particles: {
                    number: { value: 80, density: { enable: true, value_area: 800 } },
                    color: { value: '#4ca5ff' },
                    shape: {
                        type: 'circle',
                        stroke: { width: 0, color: '#000000' },
                        polygon: { nb_sides: 5 }
                    },
                    opacity: {
                        value: 0.5,
                        random: false,
                        anim: { enable: false, speed: 1, opacity_min: 0.1, sync: false }
                    },
                    size: {
                        value: 3,
                        random: true,
                        anim: { enable: false, speed: 40, size_min: 0.1, sync: false }
                    },
                    line_linked: {
                        enable: true,
                        distance: 150,
                        color: '#4ca5ff',
                        opacity: 0.3,
                        width: 1
                    },
                    move: {
                        enable: true,
                        speed: 2,
                        direction: 'none',
                        random: false,
                        straight: false,
                        out_mode: 'out',
                        bounce: false,
                        attract: { enable: false, rotateX: 600, rotateY: 1200 }
                    }
                },
                interactivity: {
                    detect_on: 'canvas',
                    events: {
                        onhover: { enable: true, mode: 'grab' },
                        onclick: { enable: true, mode: 'push' },
                        resize: true
                    },
                    modes: {
                        grab: { distance: 140, line_linked: { opacity: 1 } },
                        bubble: { distance: 400, size: 40, duration: 2, opacity: 8 },
                        repulse: { distance: 200, duration: 0.4 },
                        push: { particles_nb: 4 },
                        remove: { particles_nb: 2 }
                    }
                },
                retina_detect: true
            });
        });
        
        // Countdown Timer
        const countdownDate = new Date();
        countdownDate.setDate(countdownDate.getDate() + 30); // Set launch date 30 days from now
        
        function updateCountdown() {
            const now = new Date().getTime();
            const distance = countdownDate - now;
            
            // Time calculations
            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);
            
            // Display the result
            document.getElementById('days').innerText = days.toString().padStart(2, '0');
            document.getElementById('hours').innerText = hours.toString().padStart(2, '0');
            document.getElementById('minutes').innerText = minutes.toString().padStart(2, '0');
            document.getElementById('seconds').innerText = seconds.toString().padStart(2, '0');
            
            // If the countdown is over
            if (distance < 0) {
                clearInterval(countdownTimer);
                document.getElementById('days').innerText = '00';
                document.getElementById('hours').innerText = '00';
                document.getElementById('minutes').innerText = '00';
                document.getElementById('seconds').innerText = '00';
            }
        }
        
        // Initial call
        updateCountdown();
        
        // Update countdown every second
        const countdownTimer = setInterval(updateCountdown, 1000);
        
        // Form submission
        const subscribeForm = document.querySelector('.subscribe-form');
        const subscribeInput = document.querySelector('.subscribe-input');
        const subscribeButton = document.querySelector('.subscribe-button');
        
        subscribeButton.addEventListener('click', function(e) {
            e.preventDefault();
            const email = subscribeInput.value.trim();
            
            if (email && isValidEmail(email)) {
                // Here you would typically send the email to your server
                subscribeButton.innerText = 'Subscribed!';
                subscribeInput.value = '';
                
                setTimeout(() => {
                    subscribeButton.innerText = 'Notify Me';
                }, 2000);
            } else {
                subscribeInput.style.borderColor = '#e74c3c';
                
                setTimeout(() => {
                    subscribeInput.style.borderColor = 'rgba(255, 255, 255, 0.1)';
                }, 2000);
            }
        });
        
        function isValidEmail(email) {
            const regex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            return regex.test(email);
        }
    </script>
</body>
</html>
